<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test landing — Dr. Mohamad Izani</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{height:100%;background:#0c1726}
  body{margin:0;overflow:hidden}
  .land{
    min-height:100vh;display:grid;place-items:center;
    background:
      radial-gradient(900px 520px at 50% 42%, rgba(37,76,118,.5), transparent 68%),
      radial-gradient(420px 220px at 50% 78%, rgba(194,154,74,.12), transparent 70%),
      #0c1726;
    color:#eef3f9;position:relative;
  }
  .back{
    position:fixed;left:18px;top:18px;z-index:5;
    color:#e9dcbf;border:1px solid rgba(194,154,74,.55);
    background:rgba(18,38,61,.72);backdrop-filter:blur(8px);
    padding:8px 14px;border-radius:999px;font-size:.88rem;font-weight:600;
  }
  .back:hover{color:#fff;border-color:#e9dcbf}
  .stage{position:relative;width:min(92vw,720px);height:min(92vw,720px)}
  .scene{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(34vw,220px);height:min(34vw,220px);
    perspective:900px;cursor:grab;z-index:2;touch-action:none;
  }
  .scene:active{cursor:grabbing}
  .head{width:100%;height:100%;position:relative;transform-style:preserve-3d}
  .disc{
    position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;
    overflow:hidden;border:3px solid rgba(233,220,191,.9);
    box-shadow:0 22px 50px rgba(0,0,0,.5);
  }
  .disc img{width:100%;height:100%;object-fit:cover;display:block}
  .disc.back{
    transform:rotateY(180deg);
    background:linear-gradient(160deg,#1a3454,#0c1726 70%);
    display:grid;place-items:center;text-align:center;padding:18px;
    color:#e9dcbf;font-family:'Source Serif 4',Georgia,serif;
    font-size:clamp(.95rem,2vw,1.15rem);letter-spacing:.02em;
  }
  .name{
    position:absolute;left:50%;top:44%;z-index:3;pointer-events:none;text-align:center;
    width:min(70vw,280px);transform:translate(-50%, calc(min(17vw,110px) + 18px));
  }
  .name h1{
    font-family:'Source Serif 4',Georgia,serif;color:#fff;font-weight:600;
    font-size:clamp(1.45rem,3vw,2.1rem);letter-spacing:-.02em;
  }
  .name p{color:#c5d2e2;font-size:.92rem;margin-top:4px}
  .hint{
    position:absolute;left:0;right:0;bottom:16px;text-align:center;
    color:#8ea0b5;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
  }
  .orbit{position:absolute;inset:0;animation:spin 72s linear infinite}
  .orbit:has(a:hover){animation-play-state:paused}
  .orbit:has(a:hover) a{animation-play-state:paused}
  .slot{
    position:absolute;left:50%;top:50%;width:0;height:0;
    transform:rotate(var(--a)) translateX(min(40vw,280px));
  }
  .slot a{
    position:absolute;left:0;top:0;
    transform:translate(-50%,-50%);
    animation:upright 72s linear infinite;
    color:#f4efe4;font-weight:600;font-size:.98rem;letter-spacing:.02em;
    padding:7px 12px;border-radius:999px;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
    white-space:nowrap;
  }
  .slot a:hover{color:#12263d;background:#c29a4a;text-shadow:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes upright{to{transform:translate(-50%,-50%) rotate(-360deg)}}
  @media(prefers-reduced-motion:reduce){
    .orbit,.slot a{animation:none}
  }
  @media(max-width:640px){.hint{display:none}}
</style>
</head>
<body>
<a class="back" href="index.html">Main page</a>
<section class="land">
  <div class="stage">
    <div class="orbit" id="orbit"></div>
    <div class="scene" id="scene" title="Drag to turn">
      <div class="head" id="head">
        <div class="disc"><img id="face" src="assets/profile.jpg" alt="Dr. Mohamad Izani"></div>
        <div class="disc back">Mohamad<br>Izani</div>
      </div>
    </div>
    <div class="name">
      <h1>Mohamad Izani</h1>
      <p>Digital heritage, immersive media, and generative AI.</p>
    </div>
  </div>
  <p class="hint">Drag the portrait · it turns a full circle</p>
</section>
<script>
(function(){
  try{ sessionStorage.setItem('izaniTestLanding','1'); }catch(e){}
  fetch('assets/portrait.b64').then(function(r){return r.text();}).then(function(t){
    var img=document.getElementById('face');
    if(img && t) img.src='data:image/jpeg;base64,'+t.replace(/\s/g,'');
  }).catch(function(){});
  var items=[
    ['About','index.html'],
    ['Publications','publications.html'],
    ['My Work','portfolio-persona.html'],
    ['Students','portfolio-students.html'],
    ['Projects','projects.html'],
    ['Training','training.html'],
    ['Awards','awards.html'],
    ['Blog','blog.html'],
    ['Contact','contact.html']
  ];
  var orbit=document.getElementById('orbit');
  items.forEach(function(it,i){
    var slot=document.createElement('div');
    slot.className='slot';
    slot.style.setProperty('--a', (i*360/items.length)+'deg');
    var a=document.createElement('a');
    a.href=it[1];
    a.textContent=it[0];
    slot.appendChild(a);
    orbit.appendChild(slot);
  });
  var head=document.getElementById('head');
  var scene=document.getElementById('scene');
  var y=-18, x=8, drag=false, lx=0, ly=0;
  function paint(){ head.style.transform='rotateX('+x+'deg) rotateY('+y+'deg)'; }
  paint();
  scene.addEventListener('pointerdown', function(e){
    drag=true; lx=e.clientX; ly=e.clientY;
    scene.setPointerCapture(e.pointerId);
  });
  scene.addEventListener('pointermove', function(e){
    if(!drag) return;
    y += (e.clientX-lx)*0.5;
    x += (ly-e.clientY)*0.3;
    x=Math.max(-40, Math.min(40, x));
    lx=e.clientX; ly=e.clientY;
    paint();
  });
  function up(){ drag=false; }
  scene.addEventListener('pointerup', up);
  scene.addEventListener('pointercancel', up);
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    (function tick(){
      if(!drag){ y += 0.45; paint(); }
      requestAnimationFrame(tick);
    })();
  }
})();
</script>
</body>
</html>

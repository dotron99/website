<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test landing — Dr. Mohamad Izani</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{height:100%;background:#0c1726}
  body{margin:0;overflow:hidden}
  .land{
    min-height:100vh;display:grid;place-items:center;
    background:
      radial-gradient(900px 520px at 50% 46%, rgba(37,76,118,.45), transparent 70%),
      #0c1726;
    color:#eef3f9;position:relative;
  }
  .back{
    position:fixed;left:18px;top:18px;z-index:5;
    color:#e9dcbf;border:1px solid rgba(194,154,74,.55);
    background:rgba(18,38,61,.72);backdrop-filter:blur(8px);
    padding:8px 14px;border-radius:999px;font-size:.88rem;font-weight:600;
  }
  .back:hover{color:#fff;border-color:#e9dcbf}
  .stage{position:relative;width:min(92vw,680px);height:min(92vw,680px)}
  .scene{
    position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    width:230px;height:230px;perspective:900px;cursor:grab;z-index:2;
    touch-action:none;
  }
  .scene:active{cursor:grabbing}
  .head{
    width:100%;height:100%;position:relative;transform-style:preserve-3d;
    border-radius:50%;
  }
  .head img{
    width:100%;height:100%;object-fit:cover;border-radius:50%;
    border:3px solid rgba(233,220,191,.85);
    box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.15);
    backface-visibility:hidden;
  }
  .rim{
    position:absolute;inset:-8px;border-radius:50%;
    border:1px solid rgba(194,154,74,.35);pointer-events:none;
  }
  .name{
    position:absolute;left:0;right:0;bottom:7%;text-align:center;z-index:3;pointer-events:none;
  }
  .name h1{
    font-family:'Source Serif 4',Georgia,serif;color:#fff;font-weight:600;
    font-size:clamp(1.7rem,3vw,2.3rem);letter-spacing:-.02em;
  }
  .name p{color:#c5d2e2;font-size:.95rem;margin-top:4px}
  .hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#8ea0b5;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
  .orbit{
    position:absolute;inset:0;animation:spin 72s linear infinite;
  }
  .stage:hover .orbit{animation-play-state:paused}
  .stage:hover .orb a{animation-play-state:paused}
  .slot{
    position:absolute;left:50%;top:50%;
    transform:rotate(var(--a)) translateX(min(38vw,250px));
  }
  .orb a{
    display:inline-block;transform:translate(-50%,-50%);
    animation:upright 72s linear infinite;
    color:#f4efe4;font-weight:600;font-size:.95rem;letter-spacing:.02em;
    padding:6px 10px;border-radius:999px;
    text-shadow:0 2px 10px rgba(0,0,0,.65);
    white-space:nowrap;
  }
  .orb a:hover{color:#12263d;background:#c29a4a}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes upright{to{transform:translate(-50%,-50%) rotate(-360deg)}}
  @media(prefers-reduced-motion:reduce){
    .orbit{animation:none}
    .orb a{animation:none}
  }
  @media(max-width:640px){
    .name{bottom:12%}
    .hint{display:none}
  }
</style>
</head>
<body>
<a class="back" href="index.html">Main page</a>
<section class="land">
  <div class="stage">
    <div class="orbit" id="orbit"></div>
    <div class="scene" id="scene" title="Drag to turn">
      <div class="head" id="head">
        <img src="assets/profile.jpg" alt="Dr. Mohamad Izani">
        <div class="rim"></div>
      </div>
    </div>
    <div class="name">
      <h1>Mohamad Izani</h1>
      <p>Digital heritage, immersive media, and generative AI.</p>
    </div>
  </div>
  <p class="hint">Drag the portrait · the menu keeps moving</p>
</section>
<script>
(function(){
  try{ sessionStorage.setItem('izaniTestLanding','1'); }catch(e){}
  var items=[
    ['About','index.html'],
    ['Publications','publications.html'],
    ['My Work','portfolio-persona.html'],
    ['Students','portfolio-students.html'],
    ['Projects','projects.html'],
    ['Training','training.html'],
    ['Awards','awards.html'],
    ['Blog','blog.html'],
    ['Contact','contact.html']
  ];
  var orbit=document.getElementById('orbit');
  items.forEach(function(it,i){
    var slot=document.createElement('div');
    slot.className='slot';
    slot.style.setProperty('--a', (i*360/items.length)+'deg');
    var a=document.createElement('a');
    a.href=it[1];
    a.textContent=it[0];
    slot.appendChild(a);
    var wrap=document.createElement('div');
    wrap.className='orb';
    wrap.appendChild(slot);
    orbit.appendChild(wrap);
  });
  var head=document.getElementById('head');
  var scene=document.getElementById('scene');
  var y=-18, x=8, drag=false, lx=0, ly=0, id=null;
  function paint(){ head.style.transform='rotateX('+x+'deg) rotateY('+y+'deg)'; }
  paint();
  scene.addEventListener('pointerdown', function(e){
    drag=true; lx=e.clientX; ly=e.clientY;
    scene.setPointerCapture(e.pointerId);
  });
  scene.addEventListener('pointermove', function(e){
    if(!drag) return;
    y += (e.clientX-lx)*0.45;
    x += (ly-e.clientY)*0.28;
    x=Math.max(-35, Math.min(35, x));
    lx=e.clientX; ly=e.clientY;
    paint();
  });
  function up(){ drag=false; }
  scene.addEventListener('pointerup', up);
  scene.addEventListener('pointercancel', up);
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    (function tick(){
      if(!drag){ y += 0.12; paint(); }
      id=requestAnimationFrame(tick);
    })();
  }
})();
</script>
</body>
</html>
